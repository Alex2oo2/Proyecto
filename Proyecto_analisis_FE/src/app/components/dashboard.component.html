<div class="min-h-screen bg-gray-900">
  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold text-white">Proyecto Análisis</h1>
        <p class="text-gray-400 text-sm mt-1">Sistema de Gestión</p>
      </div>
      <div class="flex items-center gap-4">
        <a
          routerLink="/change-password"
          class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition duration-200"
        >
          Cambiar Contraseña
        </a>
        <button
          (click)="logout()"
          class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition duration-200"
        >
          Cerrar Sesión
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation Sidebar -->
  <div class="bg-gray-800 border-b border-gray-700 p-4">
    <div class="max-w-7xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
      <a routerLink="/empresas" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded transition">Empresas</a>
      <a routerLink="/sucursales" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded transition">Sucursales</a>
      <a routerLink="/usuarios" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded transition">Usuarios</a>
      <a routerLink="/roles" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded transition">Roles</a>
      <a routerLink="/modulos" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded transition">Módulos</a>
      <a routerLink="/menus" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded transition">Menús</a>
      <a routerLink="/opciones" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded transition">Opciones</a>
      <button (click)="logout()" class="px-3 py-2 bg-red-600 hover:bg-red-700 text-white rounded transition text-left">Salir</button>
    </div>
  </div>

  <!-- Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <router-outlet></router-outlet>
    
    <!-- Welcome Message -->
    <div *ngIf="currentUser" class="bg-gray-800 rounded-lg p-6 border border-gray-700">
      <h2 class="text-2xl font-bold text-white mb-2">Bienvenido, {{ currentUser.Nombre }} {{ currentUser.Apellido }}</h2>
      <p class="text-gray-400">Rol: {{ currentUser.NombreRole }}</p>
    </div>
  </main>
</div>
