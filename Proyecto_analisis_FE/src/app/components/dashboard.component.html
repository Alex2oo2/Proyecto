<div class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
  <!-- Navbar -->
  <app-navbar (toggleSidebar)="toggleSidebar()"></app-navbar>

  <!-- Main Layout -->
  <div class="flex pt-16">
    <!-- Sidebar -->
    <app-sidebar 
      [isOpen]="sidebarOpen"
      (itemClicked)="closeSidebar()">
    </app-sidebar>

    <!-- Mobile Overlay -->
    <div 
      *ngIf="sidebarOpen"
      (click)="closeSidebar()"
      class="fixed inset-0 bg-black bg-opacity-50 z-30 lg:hidden top-16">
    </div>

    <!-- Main Content -->
    <main class="flex-1 min-h-[calc(100vh-64px)] lg:ml-0">
      <!-- Welcome Section -->
      <div class="lg:block hidden bg-gradient-to-r from-blue-600/10 to-cyan-600/10 border-b border-slate-700 px-8 py-8">
        <div class="max-w-6xl">
          <h2 class="text-3xl font-bold text-white mb-2">
            Bienvenido, {{ currentUser?.Nombre }} {{ currentUser?.Apellido }}
          </h2>
          <p class="text-slate-400">
            Rol: <span class="text-blue-400 font-semibold">{{ currentUser?.NombreRole }}</span>
          </p>
        </div>
      </div>

      <!-- Page Content -->
      <div class="p-6 lg:p-8">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
