<div class="min-h-screen bg-gray-900">
  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold text-white">Proyecto Análisis</h1>
        <p class="text-gray-400 text-sm mt-1">Sistema de Gestión</p>
      </div>
      <div class="flex items-center gap-4">
        <a
          routerLink="/change-password"
          class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition duration-200"
        >
          Cambiar Contraseña
        </a>
        <button
          (click)="logout()"
          class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition duration-200"
        >
          Cerrar Sesión
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="bg-gray-800 border-b border-gray-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-8">
      <button
        (click)="setActiveTab('companies')"
        [class.border-blue-500]="activeTab === 'companies'"
        [class.text-white]="activeTab === 'companies'"
        [class.text-gray-400]="activeTab !== 'companies'"
        class="py-4 border-b-2 border-transparent font-medium transition duration-200 hover:text-white"
      >
        Empresas
      </button>
      <button
        (click)="setActiveTab('branches')"
        [class.border-blue-500]="activeTab === 'branches'"
        [class.text-white]="activeTab === 'branches'"
        [class.text-gray-400]="activeTab !== 'branches'"
        class="py-4 border-b-2 border-transparent font-medium transition duration-200 hover:text-white"
      >
        Sucursales
      </button>
    </div>
  </nav>

  <!-- Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div *ngIf="activeTab === 'companies'">
      <app-companies></app-companies>
    </div>
    <div *ngIf="activeTab === 'branches'">
      <app-branches></app-branches>
    </div>
  </main>
</div>
