<div class="min-h-screen bg-gray-900 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-gray-800 rounded-lg shadow-2xl p-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white mb-2">Proyecto Análisis</h1>
      <p class="text-gray-400">Sistema de Gestión</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Username Field -->
      <div>
        <label for="username" class="block text-sm font-medium text-gray-300 mb-2">
          Usuario
        </label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Ingresa tu usuario"
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"
          [class.border-red-500]="username?.invalid && username?.touched"
        />
        <p *ngIf="username?.invalid && username?.touched" class="text-red-400 text-sm mt-1">
          El usuario es requerido
        </p>
      </div>

      <!-- Password Field -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-300 mb-2">
          Contraseña
        </label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Ingresa tu contraseña"
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"
          [class.border-red-500]="password?.invalid && password?.touched"
        />
        <p *ngIf="password?.invalid && password?.touched" class="text-red-400 text-sm mt-1">
          La contraseña es requerida
        </p>
      </div>

      <!-- Error Message -->
      <div *ngIf="error" class="bg-red-900 border border-red-700 text-red-200 px-4 py-3 rounded-lg text-sm">
        {{ error }}
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="!loginForm.valid || isLoading"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-600 disabled:cursor-not-allowed text-white font-semibold py-2 rounded-lg transition duration-200"
      >
        <span *ngIf="!isLoading">Inicia Sesión</span>
        <span *ngIf="isLoading">Cargando...</span>
      </button>
    </form>

    <!-- Forgot Password Link -->
    <div class="mt-4 text-center">
      <a routerLink="/forgot-password" class="text-blue-400 hover:text-blue-300 font-semibold transition text-sm">
        ¿Olvidaste tu contraseña?
      </a>
    </div>

    <!-- Footer -->
    <div class="mt-6 text-center text-gray-400 text-sm">
      <p>© 2024 Proyecto Análisis 2</p>
    </div>
  </div>
</div>
