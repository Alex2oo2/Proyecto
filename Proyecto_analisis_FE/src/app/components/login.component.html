<div class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 flex items-center justify-center p-4 relative overflow-hidden">
  <!-- Background Elements -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-cyan-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
    <div class="absolute top-1/2 left-1/2 w-80 h-80 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-4000"></div>
  </div>

  <!-- Login Card -->
  <div class="w-full max-w-md relative z-10 animate-fadeIn">
    <div class="bg-gradient-to-br from-slate-800/40 to-slate-900/40 backdrop-blur-xl rounded-2xl shadow-2xl p-8 border border-slate-700/50">
      
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="w-16 h-16 mx-auto mb-4 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/50">
          <span class="text-white font-bold text-2xl">PA</span>
        </div>
        <h1 class="text-4xl font-bold bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent mb-2">
          Proyecto Análisis
        </h1>
        <p class="text-slate-400 text-sm">Sistema de Gestión Empresarial</p>
      </div>

      <!-- Login Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Username Field -->
        <div>
          <label for="username" class="block text-sm font-semibold text-slate-300 mb-2">
            Usuario
          </label>
          <input
            id="username"
            type="text"
            formControlName="username"
            placeholder="Ingresa tu usuario"
            class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50 transition backdrop-blur-sm"
            [class.border-red-500]="username.invalid && username.touched"
          />
          <p *ngIf="username.invalid && username.touched" class="text-red-400 text-xs mt-1.5 flex items-center gap-1">
            El usuario es requerido
          </p>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-semibold text-slate-300 mb-2">
            Contraseña
          </label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Ingresa tu contraseña"
            class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50 transition backdrop-blur-sm"
            [class.border-red-500]="password.invalid && password.touched"
          />
          <p *ngIf="password.invalid && password.touched" class="text-red-400 text-xs mt-1.5 flex items-center gap-1">
            La contraseña es requerida
          </p>
        </div>

        <!-- Error Message -->
        <div *ngIf="error" class="bg-red-500/20 border border-red-500/50 text-red-200 px-4 py-3 rounded-lg text-sm backdrop-blur flex items-start gap-2">
          <span>{{ error }}</span>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="!loginForm.valid || isLoading"
          class="w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-700 hover:to-cyan-700 disabled:from-slate-600 disabled:to-slate-600 disabled:cursor-not-allowed text-white font-bold py-3 rounded-lg transition duration-300 shadow-lg hover:shadow-xl hover:shadow-blue-500/50 disabled:shadow-none flex items-center justify-center gap-2 text-lg"
        >
          <span *ngIf="!isLoading">Inicia Sesión</span>
          <span *ngIf="isLoading" class="flex items-center gap-2">
            <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Cargando...
          </span>
        </button>
      </form>

      <!-- Links -->
      <div class="mt-6 flex flex-col gap-3 text-center text-sm">
        <a routerLink="/forgot-password" class="text-blue-400 hover:text-blue-300 font-semibold transition">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <!-- Footer -->
      <div class="mt-8 pt-8 border-t border-slate-700/50 text-center text-slate-500 text-xs">
        <p>© 2026 Proyecto Análisis • Sistema de Gestión Empresarial</p>
        <p class="mt-2">Versión 1.0.0</p>
      </div>
    </div>
  </div>
</div>
