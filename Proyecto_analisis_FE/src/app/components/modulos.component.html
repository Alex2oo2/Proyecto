<div class="space-y-6">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <div>
      <h1 class="text-3xl font-bold text-white">📦 Gestión de Módulos</h1>
      <p class="text-slate-400 mt-1">Administra los módulos del sistema</p>
    </div>
    <button 
      (click)="toggleForm()"
      class="w-full sm:w-auto flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white px-6 py-3 rounded-lg font-semibold transition-all duration-200 shadow-lg hover:shadow-xl">
      <span *ngIf="!showForm">➕ Nuevo Módulo</span>
      <span *ngIf="showForm">❌ Cancelar</span>
    </button>
  </div>

  </div>

  <!-- Messages -->
  <div *ngIf="error" class="bg-red-500/20 border border-red-500/50 text-red-200 p-4 rounded-lg backdrop-blur">
    {{ error }}
  </div>
  <div *ngIf="success" class="bg-green-500/20 border border-green-500/50 text-green-200 p-4 rounded-lg backdrop-blur">
    {{ success }}
  </div>

  <!-- Form Card -->
  <div *ngIf="showForm" class="bg-gradient-to-br from-slate-800 to-slate-900 p-6 rounded-xl border border-slate-700 shadow-xl">
    <h2 class="text-2xl font-bold text-white mb-6">{{ isEditMode ? '✏️ Editar Módulo' : '➕ Nuevo Módulo' }}</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-300 mb-2">Nombre</label>
          <input formControlName="Nombre" type="text" class="w-full bg-slate-700/50 border border-slate-600 text-white px-4 py-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-300 mb-2">Orden</label>
          <input formControlName="OrdenMenu" type="number" class="w-full bg-slate-700/50 border border-slate-600 text-white px-4 py-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
        </div>
      </div>
      <div class="flex gap-3 pt-4">
        <button type="submit" class="flex-1 bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white px-6 py-3 rounded-lg font-semibold transition-all duration-200">
          {{ isEditMode ? '✓ Actualizar' : '✓ Crear' }} Módulo
        </button>
      </div>
    </form>
  </div>

  <!-- Data Table -->
  <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-xl border border-slate-700 overflow-hidden shadow-xl">
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead class="bg-gradient-to-r from-slate-700 to-slate-800 border-b border-slate-700">
          <tr>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-300">ID</th>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-300">Nombre</th>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-300">Orden</th>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-300">Acciones</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-700">
          <tr *ngFor="let item of items" class="hover:bg-slate-700/50 transition-colors">
            <td class="px-6 py-4 text-sm text-slate-400">{{ item.IdModulo }}</td>
            <td class="px-6 py-4 text-sm text-slate-200 font-medium">{{ item.Nombre }}</td>
            <td class="px-6 py-4 text-sm text-slate-400">{{ item.OrdenMenu }}</td>
            <td class="px-6 py-4 text-sm space-x-2">
              <button (click)="editItem(item)" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium transition">✏️ Editar</button>
              <button (click)="deleteItem(item.IdModulo)" class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-medium transition">🗑️ Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
