<div class="space-y-6">
  <!-- Header with Add Button -->
  <div class="flex justify-between items-center">
    <h2 class="text-2xl font-bold text-white">Gestión de Empresas</h2>
    <button
      *ngIf="!showForm"
      (click)="openForm()"
      class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition duration-200"
    >
      + Nueva Empresa
    </button>
  </div>

  <!-- Success Message -->
  <div *ngIf="success" class="bg-green-900 border border-green-700 text-green-200 px-4 py-3 rounded-lg">
    {{ success }}
  </div>

  <!-- Error Message -->
  <div *ngIf="error" class="bg-red-900 border border-red-700 text-red-200 px-4 py-3 rounded-lg">
    {{ error }}
  </div>

  <!-- Form -->
  <div *ngIf="showForm" class="bg-gray-800 border border-gray-700 rounded-lg p-6">
    <h3 class="text-xl font-bold text-white mb-4">
      {{ editingId ? 'Editar Empresa' : 'Nueva Empresa' }}
    </h3>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Nombre -->
      <div>
        <label for="nombre" class="block text-sm font-medium text-gray-300 mb-2">
          Nombre <span class="text-red-500">*</span>
        </label>
        <input
          id="nombre"
          type="text"
          formControlName="Nombre"
          placeholder="Nombre de la empresa"
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-blue-500"
          [class.border-red-500]="form.get('Nombre')?.invalid && form.get('Nombre')?.touched"
        />
      </div>

      <!-- NIT -->
      <div>
        <label for="nit" class="block text-sm font-medium text-gray-300 mb-2">
          NIT <span class="text-red-500">*</span>
        </label>
        <input
          id="nit"
          type="text"
          formControlName="Nit"
          maxlength="20"
          placeholder="NIT de la empresa"
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-blue-500"
          [class.border-red-500]="form.get('Nit')?.invalid && form.get('Nit')?.touched"
        />
      </div>

      <!-- Descripcion -->
      <div>
        <label for="descripcion" class="block text-sm font-medium text-gray-300 mb-2">
          Descripción
        </label>
        <textarea
          id="descripcion"
          formControlName="Descripcion"
          placeholder="Descripción de la empresa"
          rows="3"
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-blue-500"
        ></textarea>
      </div>

      <!-- Dirección -->
      <div>
        <label for="direccion" class="block text-sm font-medium text-gray-300 mb-2">
          Dirección
        </label>
        <input
          id="direccion"
          type="text"
          formControlName="Direccion"
          placeholder="Dirección de la empresa"
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-blue-500"
        />
      </div>

      <!-- Teléfono -->
      <div>
        <label for="telefono" class="block text-sm font-medium text-gray-300 mb-2">
          Teléfono
        </label>
        <input
          id="telefono"
          type="tel"
          formControlName="Telefono"
          placeholder="Teléfono de la empresa"
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-blue-500"
        />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-300 mb-2">
          Correo Electrónico
        </label>
        <input
          id="email"
          type="email"
          formControlName="CorreoElectronico"
          placeholder="correo@empresa.com"
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-blue-500"
          [class.border-red-500]="form.get('CorreoElectronico')?.invalid && form.get('CorreoElectronico')?.touched"
        />
      </div>

      <!-- Buttons -->
      <div class="flex gap-3 pt-4">
        <button
          type="submit"
          [disabled]="!form.valid || isSubmitting"
          class="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-600 text-white rounded-lg font-medium transition duration-200"
        >
          {{ isSubmitting ? 'Guardando...' : 'Guardar' }}
        </button>
        <button
          type="button"
          (click)="closeForm()"
          class="px-6 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg font-medium transition duration-200"
        >
          Cancelar
        </button>
      </div>
    </form>
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading" class="flex justify-center py-8">
    <div class="text-gray-400">Cargando empresas...</div>
  </div>

  <!-- List -->
  <div *ngIf="!isLoading && empresas.length > 0" class="grid gap-4">
    <div *ngFor="let empresa of empresas" class="bg-gray-800 border border-gray-700 rounded-lg p-4 hover:border-gray-600 transition">
      <div class="flex justify-between items-start gap-4">
        <div class="flex-1">
          <h3 class="text-lg font-semibold text-white">{{ empresa.Nombre }}</h3>
          <p *ngIf="empresa.Descripcion" class="text-gray-400 text-sm mt-1">{{ empresa.Descripcion }}</p>
          <div class="flex flex-wrap gap-4 mt-3 text-sm text-gray-400">
            <span *ngIf="empresa.Direccion">📍 {{ empresa.Direccion }}</span>
            <span *ngIf="empresa.Telefono">📞 {{ empresa.Telefono }}</span>
            <span *ngIf="empresa.CorreoElectronico">✉️ {{ empresa.CorreoElectronico }}</span>
          </div>
        </div>
        <div class="flex gap-2">
          <button
            (click)="openForm(empresa)"
            class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded transition duration-200"
          >
            Editar
          </button>
          <button
            (click)="deleteEmpresa(empresa.IdEmpresa)"
            class="px-3 py-1 bg-red-600 hover:bg-red-700 text-white text-sm rounded transition duration-200"
          >
            Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && empresas.length === 0" class="text-center py-12">
    <p class="text-gray-400 text-lg">No hay empresas. Crea una para empezar.</p>
  </div>
</div>
