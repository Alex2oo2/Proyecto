<div class="min-h-screen bg-gray-900 p-8">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-4xl font-bold text-white">Gestión de Roles</h1>
      <button 
        (click)="toggleForm()"
        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition">
        {{ showForm ? 'Cancelar' : 'Nuevo Rol' }}
      </button>
    </div>

    <!-- Messages -->
    <div *ngIf="error" class="bg-red-600 text-white p-4 rounded mb-4">{{ error }}</div>
    <div *ngIf="success" class="bg-green-600 text-white p-4 rounded mb-4">{{ success }}</div>

    <!-- Form -->
    <div *ngIf="showForm" class="bg-gray-800 p-6 rounded-lg mb-8 border border-gray-700">
      <h2 class="text-2xl font-bold text-white mb-6">{{ isEditMode ? 'Editar Rol' : 'Nuevo Rol' }}</h2>
      <form [formGroup]="roleForm" (ngSubmit)="onSubmit()" class="grid grid-cols-1 gap-4">
        <div>
          <label class="block text-gray-300 mb-2">Nombre del Rol</label>
          <input 
            formControlName="Nombre" 
            type="text" 
            class="w-full bg-gray-700 border border-gray-600 text-white px-3 py-2 rounded">
        </div>
        <div>
          <label class="block text-gray-300 mb-2">Descripción</label>
          <textarea 
            formControlName="Descripcion" 
            class="w-full bg-gray-700 border border-gray-600 text-white px-3 py-2 rounded" rows="3"></textarea>
        </div>
        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded transition">
          {{ isEditMode ? 'Actualizar' : 'Crear' }} Rol
        </button>
      </form>
    </div>

    <!-- Table -->
    <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
      <table class="w-full">
        <thead class="bg-gray-700">
          <tr>
            <th class="px-6 py-3 text-left text-gray-300">ID</th>
            <th class="px-6 py-3 text-left text-gray-300">Nombre</th>
            <th class="px-6 py-3 text-left text-gray-300">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let role of roles" class="border-t border-gray-700 hover:bg-gray-700">
            <td class="px-6 py-3 text-gray-300">{{ role.IdRole }}</td>
            <td class="px-6 py-3 text-gray-300">{{ role.Nombre }}</td>
            <td class="px-6 py-3 text-gray-300">
              <button 
                (click)="editRole(role)" 
                class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded mr-2">
                Editar
              </button>
              <button 
                (click)="openPermisosModal(role)" 
                class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1 rounded mr-2">
                Permisos
              </button>
              <button 
                (click)="deleteRole(role.IdRole)" 
                class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded">
                Eliminar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Permisos Modal -->
    <div *ngIf="showPermisosModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
      <div class="bg-gray-800 rounded-lg p-8 max-w-4xl w-full max-h-screen overflow-y-auto border border-gray-700">
        <h2 class="text-2xl font-bold text-white mb-4">Matriz de Permisos</h2>

        <div class="mb-4">
          <label class="block text-gray-300 mb-2">Módulo</label>
          <select 
            [(ngModel)]="selectedModuloId"
            (change)="selectedRoleId && selectedModuloId && loadMatrizPermisos(selectedRoleId, selectedModuloId)"
            class="w-full bg-gray-700 border border-gray-600 text-white px-3 py-2 rounded">
            <option *ngFor="let m of modulos" [value]="m.IdModulo">{{ m.Nombre }}</option>
          </select>
        </div>

        <table class="w-full mb-4 text-sm">
          <thead class="bg-gray-700">
            <tr>
              <th class="px-4 py-2 text-left text-gray-300">Opción</th>
              <th class="px-4 py-2 text-center text-gray-300">Consultar</th>
              <th class="px-4 py-2 text-center text-gray-300">Alta</th>
              <th class="px-4 py-2 text-center text-gray-300">Baja</th>
              <th class="px-4 py-2 text-center text-gray-300">Cambio</th>
              <th class="px-4 py-2 text-center text-gray-300">Imprimir</th>
              <th class="px-4 py-2 text-center text-gray-300">Exportar</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let permiso of matrizPermisos" class="border-t border-gray-700">
              <td class="px-4 py-2 text-gray-300">{{ permiso.NombreOpcion }}</td>
              <td class="px-4 py-2 text-center">
                <input 
                  type="checkbox" 
                  [(ngModel)]="permiso.Alta"
                  class="cursor-pointer">
              </td>
              <td class="px-4 py-2 text-center">
                <input 
                  type="checkbox" 
                  [(ngModel)]="permiso.Alta"
                  (change)="togglePermiso(permiso, 'Alta')"
                  class="cursor-pointer">
              </td>
              <td class="px-4 py-2 text-center">
                <input 
                  type="checkbox" 
                  [(ngModel)]="permiso.Baja"
                  (change)="togglePermiso(permiso, 'Baja')"
                  class="cursor-pointer">
              </td>
              <td class="px-4 py-2 text-center">
                <input 
                  type="checkbox" 
                  [(ngModel)]="permiso.Cambio"
                  (change)="togglePermiso(permiso, 'Cambio')"
                  class="cursor-pointer">
              </td>
              <td class="px-4 py-2 text-center">
                <input 
                  type="checkbox" 
                  [(ngModel)]="permiso.Imprimir"
                  (change)="togglePermiso(permiso, 'Imprimir')"
                  class="cursor-pointer">
              </td>
              <td class="px-4 py-2 text-center">
                <input 
                  type="checkbox" 
                  [(ngModel)]="permiso.Exportar"
                  (change)="togglePermiso(permiso, 'Exportar')"
                  class="cursor-pointer">
              </td>
            </tr>
          </tbody>
        </table>

        <div class="flex gap-4">
          <button 
            (click)="savePermisos()"
            class="flex-1 bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded transition">
            Guardar Permisos
          </button>
          <button 
            (click)="showPermisosModal = false"
            class="flex-1 bg-gray-600 hover:bg-gray-700 text-white px-6 py-2 rounded transition">
            Cerrar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
